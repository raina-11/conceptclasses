# Local-only Supabase configuration. Production secrets belong in the hosted
# project settings, never in this file.
project_id = "concept-student-portal"

[api]
enabled = true
port = 54321
# Only RPCs in `api` are exposed. Application tables live in `app_private`.
schemas = ["api"]
extra_search_path = ["extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17
health_timeout = "2m"

[db.migrations]
enabled = true
schema_paths = []

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[realtime]
enabled = false

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[local_smtp]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "10MiB"

[auth]
enabled = true
site_url = "http://127.0.0.1:5173"
additional_redirect_urls = [
  "http://127.0.0.1:4173",
  "http://localhost:4173",
  "http://localhost:5173",
]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
# Accounts are provisioned by staff. Public signup would let an unlinked user
# create an account, so it is deliberately disabled.
enable_signup = false
enable_anonymous_sign_ins = false
minimum_password_length = 10
password_requirements = "lower_upper_letters_digits"

[auth.email]
# Keep the email/password provider enabled for invited/provisioned accounts.
# Public self-registration remains disabled by auth.enable_signup above.
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
secure_password_change = true
max_frequency = "1m"
otp_length = 6
otp_expiry = 900

[analytics]
enabled = false

[edge_runtime]
enabled = true
policy = "per_worker"
deno_version = 2

[functions.parse-result-xlsx]
enabled = true
verify_jwt = true
import_map = "./functions/parse-result-xlsx/deno.json"
entrypoint = "./functions/parse-result-xlsx/index.ts"

[functions.student-account]
enabled = true
verify_jwt = true
import_map = "./functions/student-account/deno.json"
entrypoint = "./functions/student-account/index.ts"
